<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, follow" />
		<meta name="theme-color" content="#212121" />
		<title>Página não encontrada | Lucas Coelho</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: Inter, system-ui, sans-serif;
				background: #212121;
				color: #f1eee7;
			}

			body {
				display: grid;
				min-height: 100vh;
				margin: 0;
				place-items: center;
			}

			main {
				width: min(34rem, calc(100% - 3rem));
			}

			p {
				color: #a7a49d;
				line-height: 1.6;
			}

			a {
				display: inline-block;
				margin-top: 1rem;
				color: #f1eee7;
				text-underline-offset: 0.35rem;
			}
		</style>
	</head>
	<body>
		<main>
			<p>Erro 404</p>
			<h1>Esta página não existe.</h1>
			<p>O endereço pode ter mudado ou ter sido digitado incorretamente.</p>
			<a href="/">Voltar ao portfólio</a>
		</main>
	</body>
</html>
