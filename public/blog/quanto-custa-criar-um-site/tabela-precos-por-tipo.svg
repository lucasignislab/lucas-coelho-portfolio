  <text x="80" y="170" fill="#F4F1ED" font-family="Georgia, serif" font-size="56">Quanto custa cada tipo de site em 2026</text>
  <line x1="80" y1="210" x2="1320" y2="210" stroke="#3a3a3a" stroke-width="2"/>
  <text x="80" y="252" fill="#bdb7b0" font-family="Arial, sans-serif" font-size="22">Execução profissional no Brasil, design sob medida. Escala de R$ 0 a R$ 40.000.</text>
  <g font-family="Arial, sans-serif">
    <text x="80" y="330" fill="#F4F1ED" font-size="24" font-weight="600">Landing page</text>
