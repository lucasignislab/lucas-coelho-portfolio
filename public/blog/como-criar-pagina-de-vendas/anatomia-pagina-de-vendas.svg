<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" role="img">
  <rect width="1400" height="940" fill="#212121"/>
  <text x="80" y="80" fill="#8a8580" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">ANATOMIA DE UMA PÁGINA DE VENDAS</text>
  <text x="80" y="140" fill="#F4F1ED" font-family="Georgia, serif" font-size="44">A ordem das seções que convertem</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="180" width="1240" height="100" rx="16" fill="#2a2a2a"/>
    <text x="116" y="220" fill="#E28868" font-size="18" font-weight="700">01</text>
    <text x="116" y="252" fill="#F4F1ED" font-size="24" font-weight="600">Headline e promessa</text>
    <text x="700" y="252" fill="#bdb7b0" font-size="19">O visitante decide em segundos se fica ou sai</text>
    <rect x="80" y="296" width="1240" height="100" rx="16" fill="#2a2a2a"/>
    <text x="116" y="336" fill="#E28868" font-size="18" font-weight="700">02</text>
    <text x="116" y="368" fill="#F4F1ED" font-size="24" font-weight="600">Problema e agitação</text>
    <text x="700" y="368" fill="#bdb7b0" font-size="19">Mostrar que você entende a dor melhor que ninguém</text>
    <rect x="80" y="412" width="1240" height="100" rx="16" fill="#2a2a2a"/>
    <text x="116" y="452" fill="#E28868" font-size="18" font-weight="700">03</text>
    <text x="116" y="484" fill="#F4F1ED" font-size="24" font-weight="600">Solução e mecanismo</text>
    <text x="700" y="484" fill="#bdb7b0" font-size="19">Como o produto resolve, explicado sem milagre</text>
    <rect x="80" y="528" width="1240" height="100" rx="16" fill="#2a2a2a"/>
    <text x="116" y="568" fill="#E28868" font-size="18" font-weight="700">04</text>
    <text x="116" y="600" fill="#F4F1ED" font-size="24" font-weight="600">Prova social</text>
    <text x="700" y="600" fill="#bdb7b0" font-size="19">Depoimentos, números e casos verificáveis</text>
    <rect x="80" y="644" width="1240" height="100" rx="16" fill="#2a2a2a"/>
    <text x="116" y="684" fill="#E28868" font-size="18" font-weight="700">05</text>
    <text x="116" y="716" fill="#F4F1ED" font-size="24" font-weight="600">Oferta, bônus e garantia</text>
    <text x="700" y="716" fill="#bdb7b0" font-size="19">Preço ancorado, risco removido, valor empilhado</text>
    <rect x="80" y="760" width="1240" height="100" rx="16" fill="#2a2a2a"/>
    <text x="116" y="800" fill="#E28868" font-size="18" font-weight="700">06</text>
    <text x="116" y="832" fill="#F4F1ED" font-size="24" font-weight="600">FAQ e CTA final</text>
    <text x="700" y="832" fill="#bdb7b0" font-size="19">Quebra de objeções e o pedido direto de ação</text>
  </g>
  <text x="80" y="906" fill="#8a8580" font-family="Arial, sans-serif" font-size="18">Cada seção existe para responder a objeção que impediria o clique seguinte</text>
</svg>
