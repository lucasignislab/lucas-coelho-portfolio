<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#F4F1ED"/><rect x="96" y="806" width="1408" height="1" fill="#D7D1CB"/><text x="96" y="853" fill="#212121" font-family="Georgia, serif" font-size="36" font-weight="400" text-anchor="start">L,</text><text x="1504" y="850" fill="#827F7E" font-family="Arial, sans-serif" font-size="19" font-weight="600" text-anchor="end">LUCASCOELHOUX.SITE</text><text x="96" y="95" fill="#827F7E" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">MEMÓRIA DO PROJETO</text><text x="96" y="184" fill="#212121" font-family="Georgia, serif" font-size="68" font-weight="400" text-anchor="start">O que foi decidido, e por quê</text><line x1="96" y1="225" x2="1504" y2="225" stroke="#D7D1CB" stroke-width="2"/><rect x="96" y="315" width="430" height="390" rx="24" fill="#FFFDFB" stroke="#D7D1CB" stroke-width="2"/><text x="126" y="369" fill="#827F7E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">TAREFA</text><text x="126" y="440" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="600" text-anchor="start">Escolher um plano</text><text x="126" y="491" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">para 12 pessoas.</text><text x="126" y="542" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start"></text><text x="126" y="593" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">Critério:</text><text x="126" y="644" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">comparar preço</text><text x="126" y="695" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">e limite.</text><rect x="585" y="315" width="430" height="390" rx="24" fill="#212121" stroke="#212121" stroke-width="2"/><text x="615" y="369" fill="#E28868" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">ESCOLHA</text><text x="615" y="440" fill="#FFFDFB" font-family="Arial, sans-serif" font-size="37" font-weight="600" text-anchor="start">Agrupar preço</text><text x="615" y="491" fill="#FFFDFB" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">e limite nos</text><text x="615" y="542" fill="#FFFDFB" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">cartões.</text><text x="615" y="593" fill="#FFFDFB" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start"></text><text x="615" y="644" fill="#FFFDFB" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">Motivo:</text><text x="615" y="695" fill="#FFFDFB" font-family="Arial, sans-serif" font-size="36" font-weight="400" text-anchor="start">facilitar leitura.</text><rect x="1074" y="315" width="430" height="390" rx="24" fill="#FFFDFB" stroke="#D7D1CB" stroke-width="2"/><text x="1104" y="369" fill="#827F7E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">LIMITE</text><text x="1104" y="440" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="600" text-anchor="start">Ainda falta</text><text x="1104" y="491" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">observar a</text><text x="1104" y="542" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">escolha real.</text><text x="1104" y="593" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start"></text><text x="1104" y="644" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">Revisitar após</text><text x="1104" y="695" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">evidência.</text></svg>