<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#F4F1ED"/><rect x="96" y="806" width="1408" height="1" fill="#D7D1CB"/><text x="96" y="853" fill="#212121" font-family="Georgia, serif" font-size="36" font-weight="400" text-anchor="start">L,</text><text x="1504" y="850" fill="#827F7E" font-family="Arial, sans-serif" font-size="19" font-weight="600" text-anchor="end">LUCASCOELHOUX.SITE</text><text x="96" y="95" fill="#827F7E" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">FICHA DE TRABALHO</text><text x="96" y="184" fill="#212121" font-family="Georgia, serif" font-size="68" font-weight="400" text-anchor="start">O critério não é um layout</text><line x1="96" y1="225" x2="1504" y2="225" stroke="#D7D1CB" stroke-width="2"/><rect x="96" y="320" width="676" height="180" rx="24" fill="#FFFDFB" stroke="#D7D1CB" stroke-width="2"/><text x="126" y="374" fill="#827F7E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">OBSERVAÇÃO</text><text x="126" y="445" fill="#212121" font-family="Arial, sans-serif" font-size="27" font-weight="600" text-anchor="start">Volta aos cartões para conferir limites.</text><rect x="828" y="320" width="676" height="180" rx="24" fill="#FFFDFB" stroke="#D7D1CB" stroke-width="2"/><text x="858" y="374" fill="#827F7E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">CONSEQUÊNCIA</text><text x="858" y="445" fill="#212121" font-family="Arial, sans-serif" font-size="31" font-weight="600" text-anchor="start">Escolhe sem confiança na adequação.</text><rect x="96" y="525" width="676" height="180" rx="24" fill="#FFFDFB" stroke="#D7D1CB" stroke-width="2"/><text x="126" y="579" fill="#827F7E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">HIPÓTESE</text><text x="126" y="650" fill="#212121" font-family="Arial, sans-serif" font-size="35" font-weight="600" text-anchor="start">Preço e limite estão separados.</text><rect x="828" y="525" width="676" height="180" rx="24" fill="#212121" stroke="#212121" stroke-width="2"/><text x="858" y="579" fill="#E28868" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">CRITÉRIO</text><text x="858" y="650" fill="#FFFDFB" font-family="Arial, sans-serif" font-size="29" font-weight="600" text-anchor="start">Comparar ambos no mesmo campo visual.</text></svg>