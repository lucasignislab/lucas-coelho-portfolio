<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#F4F1ED"/><rect x="96" y="806" width="1408" height="1" fill="#D7D1CB"/><text x="96" y="853" fill="#212121" font-family="Georgia, serif" font-size="36" font-weight="400" text-anchor="start">L,</text><text x="1504" y="850" fill="#827F7E" font-family="Arial, sans-serif" font-size="19" font-weight="600" text-anchor="end">LUCASCOELHOUX.SITE</text><text x="96" y="95" fill="#827F7E" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">APÓS OBSERVAR</text><text x="96" y="184" fill="#212121" font-family="Georgia, serif" font-size="68" font-weight="400" text-anchor="start">Uma avaliação abre três caminhos</text><line x1="96" y1="225" x2="1504" y2="225" stroke="#D7D1CB" stroke-width="2"/><rect x="96" y="330" width="430" height="350" rx="24" fill="#FFFDFB" stroke="#D7D1CB" stroke-width="2"/><text x="126" y="384" fill="#827F7E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">MANTER</text><text x="126" y="455" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="600" text-anchor="start">A tarefa flui</text><text x="126" y="506" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">com entendimento</text><text x="126" y="557" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">adequado.</text><rect x="585" y="330" width="430" height="350" rx="24" fill="#212121" stroke="#212121" stroke-width="2"/><text x="615" y="384" fill="#E28868" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">AJUSTAR</text><text x="615" y="455" fill="#FFFDFB" font-family="Arial, sans-serif" font-size="37" font-weight="600" text-anchor="start">Um atrito novo</text><text x="615" y="506" fill="#FFFDFB" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">aparece em texto</text><text x="615" y="557" fill="#FFFDFB" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">ou hierarquia.</text><rect x="1074" y="330" width="430" height="350" rx="24" fill="#FFFDFB" stroke="#D7D1CB" stroke-width="2"/><text x="1104" y="384" fill="#827F7E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">INVESTIGAR</text><text x="1104" y="455" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="600" text-anchor="start">A evidência ainda</text><text x="1104" y="506" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">não sustenta</text><text x="1104" y="557" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">a decisão.</text></svg>