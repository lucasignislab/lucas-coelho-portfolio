<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#F4F1ED"/><rect x="96" y="806" width="1408" height="1" fill="#D7D1CB"/><text x="96" y="853" fill="#212121" font-family="Georgia, serif" font-size="36" font-weight="400" text-anchor="start">L,</text><text x="1504" y="850" fill="#827F7E" font-family="Arial, sans-serif" font-size="19" font-weight="600" text-anchor="end">LUCASCOELHOUX.SITE</text><text x="96" y="95" fill="#827F7E" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">SEPARAR CAMADAS</text><text x="96" y="184" fill="#212121" font-family="Georgia, serif" font-size="68" font-weight="400" text-anchor="start">Da opinião ao que pode ser visto</text><line x1="96" y1="225" x2="1504" y2="225" stroke="#D7D1CB" stroke-width="2"/><rect x="96" y="310" width="430" height="390" rx="24" fill="#FFFDFB" stroke="#D7D1CB" stroke-width="2"/><text x="126" y="364" fill="#827F7E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">REAÇÃO</text><text x="126" y="435" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="600" text-anchor="start">“Está confuso.”</text><text x="126" y="486" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start"></text><text x="126" y="537" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">Sinal legítimo;</text><text x="126" y="588" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">causa indefinida.</text><rect x="585" y="310" width="430" height="390" rx="24" fill="#FFFDFB" stroke="#D7D1CB" stroke-width="2"/><text x="615" y="364" fill="#827F7E" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">OBSERVAÇÃO</text><text x="615" y="435" fill="#212121" font-family="Arial, sans-serif" font-size="36" font-weight="600" text-anchor="start">Voltou aos cartões</text><text x="615" y="486" fill="#212121" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start">para comparar limites.</text><text x="615" y="537" fill="#212121" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start"></text><text x="615" y="588" fill="#212121" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start">Comportamento situado.</text><rect x="1074" y="310" width="430" height="390" rx="24" fill="#212121" stroke="#212121" stroke-width="2"/><text x="1104" y="364" fill="#E28868" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">PERGUNTA</text><text x="1104" y="435" fill="#FFFDFB" font-family="Arial, sans-serif" font-size="37" font-weight="600" text-anchor="start">O que faltou</text><text x="1104" y="486" fill="#FFFDFB" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">para decidir?</text><text x="1104" y="537" fill="#FFFDFB" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start"></text><text x="1104" y="588" fill="#FFFDFB" font-family="Arial, sans-serif" font-size="37" font-weight="400" text-anchor="start">Próximo passo.</text></svg>