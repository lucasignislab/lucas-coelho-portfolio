[build]
  # Build command: roda `vite build` (definido no package.json)
  command = "npm run build"
  # Diretório de saída padrão do Vite
  publish = "dist"

[build.environment]
  # Versão do Node compatível com Vite 6 / React 18
  NODE_VERSION = "20"

# Permite que a aplicação resolva rotas inglesas ainda não pré-renderizadas.
[[redirects]]
  from = "/en"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/en/*"
  to = "/index.html"
  status = 200
  force = false

# Headers de cache para assets com hash (immutable)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sem cache no index.html (sempre fresh deploy)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/lovable-uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
