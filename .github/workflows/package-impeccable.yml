name: Package Impeccable for Codex

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Impeccable
        uses: actions/checkout@v4
        with:
          repository: pbakaus/impeccable
          ref: main
          path: impeccable

      - name: Prepare Codex package
        run: |
          mkdir -p package
          cp -R impeccable/.agents package/.agents
          cp -R impeccable/.codex package/.codex

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: impeccable-codex
          path: package
          if-no-files-found: error
